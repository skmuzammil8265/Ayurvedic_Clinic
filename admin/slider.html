<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider Management - Ayurveda Clinic</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="admin-dashboard">
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <h2>Admin Panel</h2>
            </div>
            <nav class="admin-nav">
                <ul>
                    <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                    <li><a href="slider.html" class="active"><i class="fas fa-images"></i> Slider Management</a></li>
                    <li><a href="gallery.html"><i class="fas fa-camera"></i> Photo Gallery</a></li>
                    <li><a href="appointments.html"><i class="fas fa-calendar-check"></i> Appointments</a></li>
                    <li><a href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
                    <li><a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-header">
                <h1>Slider Management</h1>
            </header>

            <div class="content-section">
                <div class="add-slider-form">
                    <h2>Add New Slider Image</h2>
                    <form id="addSliderForm">
                        <div class="form-group">
                            <label for="sliderTitle">Image Title</label>
                            <input type="text" id="sliderTitle" name="sliderTitle" required>
                        </div>
                        <div class="form-group">
                            <label for="sliderImage">Image</label>
                            <input type="file" id="sliderImage" name="sliderImage" accept="image/*" required>
                        </div>
                        <button type="submit" class="submit-btn">Add Slider</button>
                    </form>
                </div>

                <div class="slider-list">
                    <h2>Current Slider Images</h2>
                    <div class="slider-items" id="sliderItems">
                        <!-- Slider items will be loaded here -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/admin.js"></script>
    <script>
        // Load existing slider images
        document.addEventListener('DOMContentLoaded', function() {
            const sliders = JSON.parse(localStorage.getItem('sliders') || '[]');
            const sliderItems = document.getElementById('sliderItems');
            
            if (sliderItems) {
                sliderItems.innerHTML = '';
                sliders.forEach((slider, index) => {
                    const item = document.createElement('div');
                    item.className = 'slider-item';
                    item.innerHTML = `
                        <img src="${slider.image}" alt="${slider.title}">
                        <div class="slider-info">
                            <h3>${slider.title}</h3>
                            <button onclick="deleteSlider(${index})" class="delete-btn">Delete</button>
                        </div>
                    `;
                    sliderItems.appendChild(item);
                });
            }

            // Handle form submission
            const form = document.getElementById('addSliderForm');
            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    addSliderImage();
                });
            }
        });

        function deleteSlider(index) {
            if (confirm('Are you sure you want to delete this slider image?')) {
                const sliders = JSON.parse(localStorage.getItem('sliders') || '[]');
                sliders.splice(index, 1);
                localStorage.setItem('sliders', JSON.stringify(sliders));
                window.location.reload();
            }
        }
    </script>
</body>
</html>
