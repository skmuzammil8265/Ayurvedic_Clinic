<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments Management - Ayurveda Clinic</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="admin-dashboard">
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <h2>Admin Panel</h2>
            </div>
            <nav class="admin-nav">
                <ul>
                    <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                    <li><a href="slider.html"><i class="fas fa-images"></i> Slider Management</a></li>
                    <li><a href="gallery.html"><i class="fas fa-camera"></i> Photo Gallery</a></li>
                    <li><a href="appointments.html" class="active"><i class="fas fa-calendar-check"></i> Appointments</a></li>
                    <li><a href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
                    <li><a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-header">
                <h1>Appointments Management</h1>
                <div class="filter-options">
                    <select id="statusFilter">
                        <option value="all">All Status</option>
                        <option value="pending">Pending</option>
                        <option value="confirmed">Confirmed</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                    <input type="date" id="dateFilter">
                </div>
            </header>

            <div class="content-section">
                <div class="appointments-table-container">
                    <table class="appointments-table">
                        <thead>
                            <tr>
                                <th>Patient Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Doctor</th>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="appointmentsTableBody">
                            <!-- Appointments will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadAppointments();

            // Add event listeners for filters
            document.getElementById('statusFilter').addEventListener('change', loadAppointments);
            document.getElementById('dateFilter').addEventListener('change', loadAppointments);
        });

        function loadAppointments() {
            const statusFilter = document.getElementById('statusFilter').value;
            const dateFilter = document.getElementById('dateFilter').value;
            
            const appointments = JSON.parse(localStorage.getItem('appointments') || '[]');
            const tableBody = document.getElementById('appointmentsTableBody');
            
            if (tableBody) {
                tableBody.innerHTML = '';
                
                const filteredAppointments = appointments.filter(appointment => {
                    const matchesStatus = statusFilter === 'all' || appointment.status === statusFilter;
                    const matchesDate = !dateFilter || appointment.date === dateFilter;
                    return matchesStatus && matchesDate;
                });

                filteredAppointments.forEach(appointment => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${appointment.name}</td>
                        <td>${appointment.email}</td>
                        <td>${appointment.phone}</td>
                        <td>${appointment.doctor}</td>
                        <td>${appointment.date}</td>
                        <td>${appointment.time}</td>
                        <td><span class="status ${appointment.status}">${appointment.status}</span></td>
                        <td>
                            <button onclick="updateAppointmentStatus('${appointment.id}', 'confirmed')" class="action-btn confirm-btn">Confirm</button>
                            <button onclick="updateAppointmentStatus('${appointment.id}', 'cancelled')" class="action-btn cancel-btn">Cancel</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            }
        }

        function updateAppointmentStatus(id, newStatus) {
            const appointments = JSON.parse(localStorage.getItem('appointments') || '[]');
            const appointment = appointments.find(a => a.id === id);
            
            if (appointment) {
                appointment.status = newStatus;
                localStorage.setItem('appointments', JSON.stringify(appointments));
                loadAppointments();
            }
        }
    </script>
</body>
</html>
